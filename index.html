<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator-Invest</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Animated background -->
  <div class="background-waves"></div>

  <!-- Main container -->
  <div class="container">

    <!-- ===== Home View ===== -->
    <div id="home-view" class="view active">

      <!-- Header -->
      <header class="header">
        <h1>Calculator-Invest</h1>
        <p>Smart calculations. Real insights.</p>
      </header>

      <!-- Tool cards -->
      <section class="tool-cards">
        <!-- Basic Calculator -->
        <div class="card" id="calculator-card">
          <h2>🧮 Basic Calculator</h2>
          <p>Fast, full-featured calculator</p>
        </div>

        <!-- Value Change Calculator -->
        <div class="card" id="value-card">
          <h2>📊 Value Change Calculator</h2>
          <p>Analyze unit & value differences</p>
        </div>
      </section>

    </div>

    <!-- ===== Calculator View ===== -->
    <div id="calculator-view" class="view">
      <button class="back-btn">← Back</button>
      <h2>Basic Calculator</h2>

      <div class="calculator-panel">
        <div class="calculator-display">
          <div class="calculator-expression" id="calc-expression"></div>
          <div class="calculator-result" id="calc-result">0</div>
        </div>
        <div class="calculator-buttons">
          <button data-action="clear">AC</button>
          <button data-action="percent">%</button>
          <button data-action="delete">⌫</button>
          <button data-action="operator" data-value="/">÷</button>

          <button data-action="number" data-value="7">7</button>
          <button data-action="number" data-value="8">8</button>
          <button data-action="number" data-value="9">9</button>
          <button data-action="operator" data-value="*">×</button>

          <button data-action="number" data-value="4">4</button>
          <button data-action="number" data-value="5">5</button>
          <button data-action="number" data-value="6">6</button>
          <button data-action="operator" data-value="-">−</button>

          <button data-action="number" data-value="1">1</button>
          <button data-action="number" data-value="2">2</button>
          <button data-action="number" data-value="3">3</button>
          <button data-action="operator" data-value="+">+</button>

          <button class="wide" data-action="number" data-value="0">0</button>
          <button data-action="number" data-value=".">.</button>
          <button data-action="equals">=</button>
        </div>
      </div>

    </div>

    <!-- ===== Value Calculator View ===== -->
    <div id="value-view" class="view">
      <button class="back-btn">← Back</button>
      <h2>Value Change Calculator</h2>

      <div class="value-calculator-panel">
        <div id="value-rows-container">
          <!-- Rows will be inserted here -->
        </div>

        <button id="add-row-btn">+ Add Another Row</button>

        <div class="summary-section" id="value-summary">
          <h3>Summary</h3>
          <p id="unit-summary"></p>
          <p id="value-summary-text"></p>
        </div>
      </div>

    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
