<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator-Invest</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Animated background -->
  <div class="background-waves"></div>

  <!-- Main container -->
  <div class="container">

    <!-- Header -->
    <header class="header">
      <h1>Calculator-Invest</h1>
      <p>Smart calculations. Real insights.</p>
    </header>

    <!-- Tool cards -->
    <section class="tool-cards">
      <!-- Basic Calculator -->
      <div class="card" id="calculator-card">
        <h2>🧮 Basic Calculator</h2>
        <p>Fast, full-featured calculator</p>
      </div>

      <!-- Value Change Calculator -->
      <div class="card" id="value-card">
        <h2>📊 Value Change Calculator</h2>
        <p>Analyze unit & value differences</p>
      </div>
    </section>

  </div>

</body>
</html>
